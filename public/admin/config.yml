# Panel de administración (Decap CMS) — Melipeuco Capital del Trekking
# Cada cambio guardado aquí se convierte en un commit en el repositorio y el sitio se vuelve a publicar.
backend:
  name: github
  repo: informatica130/CapitalDelTrekking
  branch: main
  # base_url: https://tu-servidor-oauth.ejemplo.cl   # necesario si el sitio NO está en Netlify (ver README)
  commit_messages:
    create: Crear {{collection}} «{{slug}}»
    update: Actualizar {{collection}} «{{slug}}»
    delete: Eliminar {{collection}} «{{slug}}»
    uploadMedia: Subir imagen «{{path}}»
    deleteMedia: Eliminar imagen «{{path}}»
# Permite editar en local con `npx decap-server` (ver README)
local_backend: true
locale: es
site_url: https://melipeucocapitaldeltrekking.cl
logo_url: /marca/logo-color.svg
media_folder: public/media
public_folder: /media
publish_mode: editorial_workflow
collections:
- name: rutas
  label: Rutas de trekking
  label_singular: Ruta
  description: Las fichas de rutas con su track GPX, mapa y perfil de elevación.
  folder: src/content/rutas
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{fields.slug}}'
  identifier_field: titulo
  summary: '{{titulo}} · {{interes}} · {{fields.extension}}'
  sortable_fields:
  - titulo
  - interes
  - dificultad
  view_groups:
  - label: Nivel
    field: interes
  view_filters:
  - label: Familiares
    field: interes
    pattern: Familiares
  - label: Trekkeros
    field: interes
    pattern: Trekkeros
  - label: Expertos
    field: interes
    pattern: Expertos
  - label: Ocultas
    field: publicado
    pattern: false
  fields:
  - label: Título
    name: titulo
    widget: string
  - label: Dirección web (slug)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Solo minúsculas, números y guiones
    hint: 'Ej.: laguna-captren. Forma parte de la URL; no lo cambies si la página ya está publicada.'
  - label: Publicado
    name: publicado
    widget: boolean
    default: true
    hint: Desactívalo para ocultar la ficha sin borrarla.
  - label: Destacado en portada
    name: destacado
    widget: boolean
    default: false
    required: false
  - label: Nivel
    name: interes
    widget: select
    options:
    - Familiares
    - Trekkeros
    - Expertos
  - label: Subtítulo
    name: subtitulo
    widget: string
    required: false
  - label: Imagen principal
    name: imagen
    widget: image
    required: false
    choose_url: true
  - label: Descripción
    name: cuerpo
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
  - label: Extensión
    name: extension
    widget: string
    required: false
    hint: 'Ej.: 5,8 km'
  - label: Duración
    name: duracion
    widget: string
    required: false
    hint: 'Ej.: Full day, 4 h'
  - label: Dificultad (escala MIDE 1-5)
    name: dificultad
    widget: select
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    required: false
  - label: Condición
    name: condicion
    widget: string
    required: false
    hint: 'Ej.: Autoguiable, Con guía'
  - label: Tipo de recorrido
    name: tipo_recorrido
    widget: select
    multiple: true
    options:
    - ida y vuelta
    - circuito
    - travesia
    - ida y vuelta travesia
    required: false
  - label: Track GPX
    name: gpx
    widget: file
    required: false
  - label: Coordenadas [latitud, longitud]
    name: coords
    widget: list
    required: false
    hint: 'Dos números: latitud y longitud (ej. -38.85 y -71.69). Se usan para el mapa.'
    field:
      label: Valor
      name: valor
      widget: number
      value_type: float
  - label: Datos destacados (franja superior)
    name: resumen
    widget: list
    required: false
    summary: '{{fields.k}}: {{fields.v}}'
    fields:
    - label: Dato
      name: k
      widget: string
    - label: Valor
      name: v
      widget: string
  - label: Bloques de información
    name: grupos
    widget: list
    required: false
    summary: '{{fields.titulo}}'
    fields:
    - label: Título del bloque
      name: titulo
      widget: string
    - label: Campos
      name: campos
      widget: list
      summary: '{{fields.k}}: {{fields.v}}'
      fields:
      - label: Campo
        name: k
        widget: string
      - label: Valor
        name: v
        widget: string
  - label: Galería de fotos
    name: galeria
    widget: list
    required: false
    field:
      label: Foto
      name: foto
      widget: image
      choose_url: true
  - label: Operadores que la ofrecen
    name: operadores
    widget: relation
    collection: operadores
    search_fields:
    - titulo
    value_field: slug
    display_fields:
    - titulo
    multiple: true
    required: false
  - label: Rutas relacionadas
    name: relacionados
    widget: relation
    collection: rutas
    search_fields:
    - titulo
    value_field: slug
    display_fields:
    - titulo
    multiple: true
    required: false
  - label: Mapa de Google (URL de inserción)
    name: mapa_embed
    widget: string
    required: false
    hint: 'Opcional. En Google Maps: Compartir → Insertar un mapa → copiar solo la URL del src.'
